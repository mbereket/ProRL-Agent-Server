# Single-node LoRA smoke on SWE-Gym-Lite: 2 tasks x 4 attempts x 2 steps (4 GPUs train, 4 serve).
#   bash launch.sh configs/smoke-1node.yaml
name: miles-swegym-lite-smoke-1node

tasks:
  dir: ${WORKROOT}/tasks/swegym-lite
  n: 2
  seed: 0

harness:
  name: mini_swe_agent
  model_name: openai/gpt-5.4
  settings:
    step_limit: 64
    cost_limit: 0
  session_timeout: 3000
  request_timeout: 3600
  max_run_workers: 8
  max_async_level: 1

model:
  hf_checkpoint: Qwen/Qwen3.5-9B

lora:
  rank: 32
  alpha: 64

cluster:
  num_nodes: 1
  actor_num_gpus: 4
  tp_size: 2
  context_parallel_size: 1
  gpus_per_engine: 1

rollout:
  batch_size: 2
  n_samples_per_prompt: 4
  num_steps: 2
  max_prompt_len: 12000
  max_response_len: 4000
  sglang_context_length: 16384

training:
  sync: true
  max_tokens_per_gpu: 16384
  drop_zero_variance_groups: false
  save_interval: 1

wandb:
  project: harbor-miles-grpo
