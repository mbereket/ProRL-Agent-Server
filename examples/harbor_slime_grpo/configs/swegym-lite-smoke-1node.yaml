# Single-node smoke on SWE-Gym-Lite: 2 tasks x 4 samples x 2 steps.
#   python datasets/swegym_lite.py --output $WORKROOT/tasks/swegym-lite --limit 10
#   bash launch.sh configs/swegym-lite-smoke-1node.yaml
name: swegym-lite-smoke-1node

tasks:
  dir: ${WORKROOT}/tasks/swegym-lite
  n: 2
  seed: 0

harness:
  name: mini_swe_agent
  model_name: openai/gpt-5.4
  settings:
    step_limit: 64
    cost_limit: 0
  session_timeout: 3000
  request_timeout: 3600
  max_run_workers: 8
  max_async_level: 1

model:
  hf_checkpoint: Qwen/Qwen3.5-9B
  model_args_file: model_args_9b.sh
  end_of_turn_token_id: 248046

cluster:
  num_nodes: 1
  actor_num_gpus: 4
  tp_size: 4
  context_parallel_size: 1
  sandbox_nodes: head

rollout:
  batch_size: 2
  n_samples_per_prompt: 4
  num_epoch: 2
  max_prompt_len: 12000
  max_response_len: 4000
  sglang_context_length: 16384

training:
  sync: true
  max_tokens_per_gpu: 16384
  lr: 1e-6
  use_kl_loss: false
  grpo_std_normalization: false
  group_id_scope: trajectory
  timeout_reward_zero: true
  drop_zero_variance_groups: true
  save_interval: 1

wandb:
  project: harbor-slime-grpo
