# Qwen3.5-9B GRPO on a 32-task sample of TMax-15k, two 8-GPU nodes
# (node A: TP4 x CP2 trainer, node B: 8 SGLang engines). Synchronous.
#
# Materialize the tasks once:
#   python datasets/tmax15k.py --output $WORKROOT/tasks/tmax15k
# then:
#   bash slurm_launch.sh --config configs/tmax15k-qwen35-9b-2node.yaml --partition <p> --account <a>
name: tmax15k-qwen35-9b-2node

tasks:
  dir: ${WORKROOT}/tasks/tmax15k         # ${ENV} expands; relative paths resolve against this file
  n: 32                                  # random sample (omit for all)
  seed: 0

harness:
  name: mini_swe_agent                   # bash-tool agent, closest to TMax's own harness
  model_name: openai/gpt-5.4             # cosmetic: the gateway rewrites it to the served model
  settings:
    step_limit: 64                       # TMax: max 64 tool calls
    cost_limit: 0
  session_timeout: 3000                  # agent 1800 + verifier 600 + margin (task.toml values)
  request_timeout: 3600
  max_run_workers: 16
  max_async_level: 1

model:
  hf_checkpoint: Qwen/Qwen3.5-9B
  model_args_file: model_args_9b.sh
  end_of_turn_token_id: 248046           # <|im_end|> for Qwen3.5

cluster:
  num_nodes: 2
  actor_num_gpus: 8                      # whole nodes when multi-node; the rest serve
  tp_size: 4
  context_parallel_size: 2

rollout:
  batch_size: 8                          # prompts per step
  n_samples_per_prompt: 16
  num_epoch: 30                          # 32 tasks / 8 per step = 4 steps per epoch
  max_prompt_len: 24000
  max_response_len: 8000
  # Keep sglang_context_length = max_tokens_per_gpu x context_parallel_size so
  # the trainer never drops a trace the agent was allowed to produce.
  sglang_context_length: 32768

training:
  sync: true                             # train.py: rollout -> update -> weight sync per step
  max_tokens_per_gpu: 16384              # x CP2 = 32768; known to fit H100-80GB for 9B
  lr: 1e-6
  use_kl_loss: false
  grpo_std_normalization: false          # mean-only advantages
  group_id_scope: trajectory
  timeout_reward_zero: true
  drop_zero_variance_groups: true
  save_interval: 5

wandb:
  project: harbor-slime-grpo
