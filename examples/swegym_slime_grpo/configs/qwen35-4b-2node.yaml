# Qwen3.5-4B, two 8-GPU nodes: node A trains (TP2 x CP4 = 8 GPUs), node B
# serves 8 SGLang engines. CP4 lifts the per-trace cap to 4 x 16384 = 65k
# tokens, which covers codex's long merged traces.
#   bash slurm_launch.sh --config configs/qwen35-4b-2node.yaml --partition <p> --account <a>
name: qwen35-4b-2node

model:
  hf_checkpoint: Qwen/Qwen3.5-4B
  model_args_file: model_args.sh

cluster:
  num_nodes: 2
  actor_num_gpus: 8                     # multi-node: whole nodes only (slime v0.3.0)
  tp_size: 2
  context_parallel_size: 4

rollout:
  batch_size: 4
  n_samples_per_prompt: 16
  num_epoch: 1
  max_prompt_len: 32000
  max_response_len: 16000
  sglang_context_length: 64000

training:
  max_tokens_per_gpu: 16384             # x CP4 = 65536-token traces
  lr: 1e-6
  use_kl_loss: true
  kl_loss_coef: 0.001
  grpo_std_normalization: true
  save_interval: 10

wandb:
  project: polar-swegym-grpo
