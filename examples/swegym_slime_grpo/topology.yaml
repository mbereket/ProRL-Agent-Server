# Polar topology template; run.sh renders ${VARS} with envsubst.
# Single node: bind/public host 127.0.0.1. Multi-node: POLAR_BIND_HOST=0.0.0.0
# and POLAR_PUBLIC_HOST=<head IP> so Ray actors on other nodes can reach it.
rollout:
  host: ${POLAR_BIND_HOST}
  port: ${POLAR_ROLLOUT_PORT}
  public_url: ${POLAR_ROLLOUT_URL}
  save_dir: ./rollout_results

gateway:
  heartbeat_interval_seconds: 30
  nodes:
    - id: localhost-node-01
      host: ${POLAR_BIND_HOST}
      port: ${POLAR_GATEWAY_PORT}
      public_url: ${POLAR_GATEWAY_URL}
      max_init_workers: 16
      max_run_workers: 16
      max_postrun_workers: 16
      model_served: ${MODEL_SERVED}
      inference:
        engine: sglang
        base_url: ${SGLANG_ROUTER_BASE_URL}
